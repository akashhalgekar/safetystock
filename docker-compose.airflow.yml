# Airflow, on the SAME Docker network as the Postgres above.
#
# THE GOTCHA: inside these containers, "localhost" is the Airflow container, not
# your Mac. The database host must be the CONTAINER NAME and the INTERNAL port:
#   PGHOST=ss-postgres   PGPORT=5432
# Note 5432 even if you mapped 5433 on the host. Host port mapping only affects
# traffic from your machine; container-to-container traffic uses the internal
# port. This is the single most common Airflow-plus-Postgres failure.
#
#   docker compose -f docker-compose.yml -f docker-compose.airflow.yml up -d
#   open http://localhost:8080   (admin / admin)

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@ss-postgres:5432/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    PROJECT_DIR: /opt/airflow/project
    PYTHONPATH: /opt/airflow/project
    PGHOST: ss-postgres        # NOT localhost
    PGPORT: "5432"             # NOT the host-mapped port
    PGDATABASE: safetystock
    PGUSER: postgres
    PGPASSWORD: postgres
    _PIP_ADDITIONAL_REQUIREMENTS: "pandas numpy scipy psycopg2-binary python-dotenv PyYAML pyarrow"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/project/pipeline
    - ./config.yaml:/opt/airflow/project/config.yaml
    - ./data:/opt/airflow/project/data
    - ./logs:/opt/airflow/logs
  user: "50000:0"
  networks: [ssnet]
  depends_on:
    postgres:
      condition: service_healthy

services:
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        until PGPASSWORD=postgres psql -h ss-postgres -U postgres -lqt 2>/dev/null | cut -d\| -f1 | grep -qw airflow; do
          PGPASSWORD=postgres psql -h ss-postgres -U postgres -c "CREATE DATABASE airflow" 2>/dev/null || sleep 2
        done
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname a --lastname b --role Admin --email a@b.c || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
